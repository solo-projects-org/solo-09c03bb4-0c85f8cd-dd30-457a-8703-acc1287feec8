services:
  susceptibility:
    build: .
    image: infection-susceptibility:1.0.0
    container_name: infection-susceptibility
    ports:
      - "8000:8000"
    environment:
      APP_DB_PATH: /data/susceptibility.db
    volumes:
      - susceptibility-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4).status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  susceptibility-data:
